note: >-
  Matchpoint Therapeutics documents no rate limits — it runs no developer program and no developer
  documentation exists to state one. An honest zero: not "unlimited", but "unsignalled". Two
  unpublished controls do sit in front of the surface and a consumer should assume them. First,
  Cloudflare fronts every response (cf-ray on all of them) and can challenge or throttle at the
  edge without any application-level signal. Second, WP Engine's object cache answers with
  `x-cacheable: SHORT` and `cache-control: max-age=600, must-revalidate`, so a hot collection is
  served from cache for ten minutes. The deployment also registers
  /wpe/cache-plugin/v1/rate_limit_status, but that route is WP Engine's authenticated cache-plugin
  administration endpoint, not a consumer-facing limit, and it is not part of the catalogued
  contract. robots.txt sets `Disallow:` with no Crawl-delay, so no crawl budget is published
  either.
