note: >-
  Matchpoint Therapeutics publishes no versioning policy, no deprecation policy, no SLA, no status
  page and no changelog for this surface, because it does not present it as a product. The
  lifecycle of the API is therefore the lifecycle of the WordPress install underneath it: it moves
  when core and the installed plugins move, without notice to any consumer. No `StatusPage` and no
  `Deprecation` pointer is emitted in apis.yml — there is nothing to point at.
