gaps:
- >-
  team_types is registered but empty, so role grouping is not machine-readable (see TeamMember).
- >-
  `author` is a dangling reference on every post-like object because /wp/v2/users is 401-gated.
- >-
  No custom meta keys are exposed, so pipeline, target, programme and partnership facts — the
