    target: Term
    via: categories
    detail: Category term ids. All 5 posts carry term 1 (uncategorized).
  - type: has_many
    target: Term
    via: tags
    detail: post_tag term ids. Empty on this deployment.
  - type: has_one
    target: MediaItem
    via: featured_media
  - type: belongs_to
    target: User
    via: author
    detail: The /wp/v2/users collection is 401-gated, so the author id cannot be resolved anonymously.
  - type: has_many
    target: Comment
    via: _links.replies
    detail: Zero comments exist.
- name: Page
  collection: /wp/v2/pages
  count_at_harvest: 3
  description: A corporate page — homepage (10), privacy policy (9), terms of use (18).
  relationships:
  - type: belongs_to
    target: Page
    via: parent
