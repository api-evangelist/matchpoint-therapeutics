  - type: has_one
    target: MediaItem
    via: featured_media
  - type: belongs_to
    target: User
    via: author
- name: TeamMember
  collection: /wp/v2/team
  count_at_harvest: 19
  description: >-
    The `team` custom post type — the company's executive team, board of directors, board observers
    and scientific founders. The richest company-specific structure on the deployment.
  relationships:
  - type: has_many
    target: Term
    via: team_types
    detail: >-
      Terms from the team_types taxonomy. The taxonomy is registered and hierarchical but carries
      ZERO terms, so the executive / board / observer / founder grouping a reader sees rendered on
      the homepage exists only in the theme's presentation layer and is NOT retrievable through the
      API. This is the single most consequential modelling gap on the deployment: an agent can list
      all 19 people but cannot tell a director from a founder without parsing the biography text.
  - type: has_one
    target: MediaItem
    via: featured_media
    detail: The headshot.
