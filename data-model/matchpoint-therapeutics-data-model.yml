note: >-
  Entity-relationship graph of the anonymously readable Matchpoint Therapeutics content API,
  derived from the $ref graph and the id-reference fields in the specs in openapi/. Matchpoint
  publishes no object reference; identifiers are bare integers with no prefixes or domains, so
  nothing here comes from documentation.
identifier_scheme:
  style: integer
  prefixes: []
  detail: >-
    Every object is keyed by a bare auto-increment integer, unique per WordPress object table, not
    per collection — posts, pages, media and team members share one id space, which is why post 1,
    page 9, page 10, page 18, team 258 and media ids all coexist without collision. IDs are sparse:
    media id 1 does not exist.
entities:
- name: Post
  collection: /wp/v2/posts
  count_at_harvest: 5
  description: A news item — company press release or third-party coverage.
  relationships:
