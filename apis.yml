aid: matchpoint-therapeutics
name: Matchpoint Therapeutics
description: >-
  Matchpoint Therapeutics is a privately held biotechnology company headquartered in Watertown,
  Massachusetts — Cambridge at launch — that discovers precision small-molecule covalent medicines
  intended to transform the treatment of immune diseases and other serious illness. It was founded
  by covalent-chemistry, proteomics and computational-science researchers from Stanford University
  and Harvard Medical School, closed a $30 million seed round co-led by Atlas Venture and Access
  Biotechnology in November 2021, and launched publicly in October 2022 with $100 million in total
  financing after a $70 million Series A led by Sanofi Ventures with Vertex Ventures HC, Digitalis
  Ventures and Alexandria Venture Investments. Its proprietary Advanced Covalent Exploration (ACE)
  platform combines industry-leading chemoproteomics that detects allosteric, transient and cryptic
  binding pockets in native cells, machine-learning algorithms that prioritise targets and guide
  medicinal chemistry, and a continuously evolving proprietary library of covalent compounds
  spanning fragments through drug-like leads. In July 2025 Matchpoint entered an exclusive option
  and licence agreement with Novartis to develop oral covalent inhibitors against a transcription
  factor linked to multiple inflammatory diseases, worth up to $60 million upfront and in research
  funding and up to $1 billion in total potential payments. Matchpoint runs no developer program and
  publishes no product API, developer portal, API reference or SDK. The only machine-readable
  surface reachable without credentials is the WordPress REST content API behind matchpointtx.com,
  catalogued here.
